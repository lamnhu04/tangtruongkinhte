<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Tương Tự KTVM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="header">
    <nav>
        <a href="#home">Trang Chủ</a>
        <a href="#about">Giới Thiệu</a>
        <a href="#projects">Dự Án</a>
        <a href="#contact">Liên Hệ</a>
    </nav>
</header>

<section id="home" class="section-full">
    <h1>Chào Mừng Đến Với Trang Web Của Tôi</h1>
    <p>Đây là trang web demo giống KTVM</p>
</section>

<section id="about" class="section-full">
    <h2>Giới Thiệu</h2>
    <p>Một đoạn giới thiệu bản thân hoặc nội dung bạn muốn.</p>
</section>

<section id="projects" class="section-full">
    <h2>Dự Án</h2>
    <div class="cards">
        <div class="card">Dự án 1</div>
        <div class="card">Dự án 2</div>
        <div class="card">Dự án 3</div>
    </div>
</section>

<section id="contact" class="section-full">
    <h2>Liên Hệ</h2>
    <form>
        <input type="text" placeholder="Tên của bạn">
        <input type="email" placeholder="Email">
        <textarea placeholder="Tin nhắn"></textarea>
        <button>Gửi</button>
    </form>
</section>

<footer>
    © 2026 — Trang web tạo bởi bạn!
</footer>

<script src="script.js"></script>
</body>
</html>
